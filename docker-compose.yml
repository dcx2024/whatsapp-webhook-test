version: '3.8'

networks:
  pern-network:
    driver: bridge

volumes:
  postgres_data:
  npm_data:
  npm_letsencrypt:

services:
  # --- NGINX PROXY MANAGER ---
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm-gateway
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - pern-network

  # --- POSTGRESQL DATABASE ---
  postgres-db:
    image: postgres:15-alpine
    container_name: pern-db
    restart: unless-stopped
    environment:
      # Docker pulls these straight from your local .env file
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pern-network

  # --- NODE / EXPRESS BACKEND API ---
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pern-backend
    restart: unless-stopped
    depends_on:
      - postgres-db
    environment:
      NODE_ENV: production
      DB_HOST: postgres-db
      DB_PORT: 5432
      # Passing the hidden credentials securely into the Node container
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    networks:
      - pern-network

  # --- REACT FRONTEND CLIENT ---
  frontend-client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pern-frontend
    restart: unless-stopped
    depends_on:
      - backend-api
    networks:
      - pern-network